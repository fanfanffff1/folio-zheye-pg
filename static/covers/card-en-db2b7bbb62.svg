<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="By His Excellency Sir William Howe, K.B. general and commander in chief &amp;c. &amp;c. &amp;c. Proclamation">
  <rect width="400" height="600" fill="#1b1712"/>
  <rect x="16" y="16" width="368" height="568" fill="none" stroke="#c4a574" stroke-width="1"/>
    <text x="40" y="250" fill="#f2ead9" font-size="23" font-family="Palatino, Songti SC, serif">By His</text>
  <text x="40" y="284" fill="#f2ead9" font-size="23" font-family="Palatino, Songti SC, serif">Excellency Sir</text>
  <text x="40" y="318" fill="#f2ead9" font-size="23" font-family="Palatino, Songti SC, serif">William Howe,</text>
  <text x="40" y="352" fill="#f2ead9" font-size="23" font-family="Palatino, Songti SC, serif">K.B. general</text>
  <text x="40" y="386" fill="#f2ead9" font-size="23" font-family="Palatino, Songti SC, serif">and commander</text>
  <text x="40" y="436" fill="#c4a574" font-size="15" font-family="Palatino, Songti SC, serif">Great Britain.</text>
  <text x="40" y="460" fill="#c4a574" font-size="15" font-family="Palatino, Songti SC, serif">Army.</text>
</svg>
