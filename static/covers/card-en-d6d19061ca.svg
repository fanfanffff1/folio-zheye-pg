<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Alumni oxonienses: the members of the University of Oxford, 1715-1886: their parentage, birthplace, and year of birth, with a record of their degrees">
  <rect width="400" height="600" fill="#1b1712"/>
  <rect x="16" y="16" width="368" height="568" fill="none" stroke="#c4a574" stroke-width="1"/>
    <text x="40" y="250" fill="#f2ead9" font-size="23" font-family="Palatino, Songti SC, serif">Alumni</text>
  <text x="40" y="284" fill="#f2ead9" font-size="23" font-family="Palatino, Songti SC, serif">oxonienses:</text>
  <text x="40" y="318" fill="#f2ead9" font-size="23" font-family="Palatino, Songti SC, serif">the members of</text>
  <text x="40" y="352" fill="#f2ead9" font-size="23" font-family="Palatino, Songti SC, serif">the University</text>
  <text x="40" y="386" fill="#f2ead9" font-size="23" font-family="Palatino, Songti SC, serif">of Oxford,</text>
  <text x="40" y="436" fill="#c4a574" font-size="15" font-family="Palatino, Songti SC, serif">University of</text>
  <text x="40" y="460" fill="#c4a574" font-size="15" font-family="Palatino, Songti SC, serif">Oxford, Joseph</text>
</svg>
