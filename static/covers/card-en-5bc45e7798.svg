<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The life of General Francis Marion, a celebrated partisan officer, in the revolutionary war, against the British and Tories in South Carolina and Georgia">
  <rect width="400" height="600" fill="#1b1712"/>
  <rect x="16" y="16" width="368" height="568" fill="none" stroke="#c4a574" stroke-width="1"/>
    <text x="40" y="250" fill="#f2ead9" font-size="23" font-family="Palatino, Songti SC, serif">The life of</text>
  <text x="40" y="284" fill="#f2ead9" font-size="23" font-family="Palatino, Songti SC, serif">General</text>
  <text x="40" y="318" fill="#f2ead9" font-size="23" font-family="Palatino, Songti SC, serif">Francis</text>
  <text x="40" y="352" fill="#f2ead9" font-size="23" font-family="Palatino, Songti SC, serif">Marion, a</text>
  <text x="40" y="386" fill="#f2ead9" font-size="23" font-family="Palatino, Songti SC, serif">celebrated</text>
  <text x="40" y="436" fill="#c4a574" font-size="15" font-family="Palatino, Songti SC, serif">Mason Locke Weems,</text>
  <text x="40" y="460" fill="#c4a574" font-size="15" font-family="Palatino, Songti SC, serif">William Dobein</text>
</svg>
