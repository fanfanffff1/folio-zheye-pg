services:
  - type: web
    name: folio-zheye-pg
    runtime: docker
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: FOLIO_SECRET_KEY
        generateValue: true
      - key: FOLIO_ADMIN_KEY
        generateValue: true
      - key: FOLIO_ADMIN_EMAIL
        value: 1797098277@qq.com
      - key: FOLIO_ADMIN_USERNAME
        value: fan
      - key: DATABASE_URL
        # Neon: use the pooled (-pooler) endpoint for the app; keep the unpooled
        # neondb_owner URL for migrations/seeding.
        sync: false
      - key: MAP_CDN_BASE
        # R2/Cloudflare public origin, e.g. https://pub-xxxx.r2.dev
        # (same value as FOLIO_S3_PUBLIC_BASE). Serve map GeoJSON from the CDN.
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      - key: FOLIO_COVER_BASE_URL
        sync: false
      - key: FOLIO_S3_ENDPOINT
        sync: false
      - key: FOLIO_S3_ACCESS_KEY
        sync: false
      - key: FOLIO_S3_SECRET_KEY
        sync: false
      - key: FOLIO_S3_BUCKET
        sync: false
      - key: FOLIO_S3_PUBLIC_BASE
        sync: false
      - key: FOLIO_DATA_DIR
        value: /app/data
      - key: FOLIO_CATALOG_DIR
        value: /app/catalog
      - key: PORT
        value: 8000
