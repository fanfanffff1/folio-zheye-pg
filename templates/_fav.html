{% set liked = book.id in favorite_ids %}
{% set likes = favorite_counts.get(book.id, 0) %}
<div class="fav-block{% if fav_hint|default(false) %} is-detail{% endif %}">
  <button type="button"
    class="fav-btn{% if liked %} is-on{% endif %}"
    data-fav="{{ book.slug }}"
    data-authed="{{ '1' if current_user else '0' }}"
    aria-pressed="{{ 'true' if liked else 'false' }}"
    aria-label="{% if liked %}取消喜欢{% else %}喜欢这本书{% endif %}">
    <svg class="fav-heart" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12.1 21.35l-1.1-1C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.9 11.85l-1 1z"/>
    </svg>
  </button>
  <p class="fav-count"><strong data-fav-count>{{ likes }}</strong> 人喜欢</p>
  {% if fav_hint|default(false) %}
  <p class="fav-hint">点击喜欢，会加入个人中心的「我的喜欢」，像放进自己的书架，之后就不会迷路。</p>
  {% endif %}
</div>
