{% extends "base.html" %}
{% block content %}
<section class="auth-split">
  <aside class="auth-art" aria-hidden="true">
    <p class="hand-script">Stories for a Brighter You</p>
    <div class="auth-mist"></div>
    <div class="auth-leaf"></div>
    <p>一个账号，用来收藏、推荐，以及看见自己的评论。</p>
  </aside>
  <div class="auth-card">
    <p class="kicker">FOLIO 折页</p>
    <h1>创建账号</h1>
    <p>注册后即可推荐图书、收藏喜欢的书。</p>
    {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
    <form class="auth-form" method="post" action="/register">
      <input type="hidden" name="csrf" value="{{ csrf }}" />
      <input type="hidden" name="next" value="{{ next_url }}" />
      <label>用户名<input name="username" required maxlength="30" autocomplete="username" /></label>
      <label>昵称<input name="nickname" required maxlength="30" /></label>
      <label>邮箱<input name="email" type="email" required autocomplete="email" /></label>
      <label>密码
        <span class="pw-wrap">
          <input name="password" type="password" required minlength="8" autocomplete="new-password" data-password />
          <button type="button" class="pw-toggle" data-pw-toggle>显示</button>
        </span>
      </label>
      <label>确认密码<input name="confirm" type="password" required minlength="8" autocomplete="new-password" /></label>
      <button type="submit" class="btn-primary auth-submit">创建账号</button>
    </form>
    <p class="auth-links"><a href="/login?next={{ next_url | urlencode }}">已有账号，去登录</a></p>
    <p><a class="btn-text" href="/">以访客身份继续</a></p>
  </div>
</section>
{% endblock %}
